<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OTP Email</title>
  <style>
    body {
      font-family: Arial, sans-serif;
    }
    .otp {
      font-size: 20px;
      font-weight: bold;
      color: #333;
    }
  </style>
</head>
<body>
  <p>Dear User,</p>
  <p>Your OTP code is: <span class="otp">{{otp}}</span></p>
  <p>This code is valid for 6 minutes. Do not share it with anyone.</p>
  <p>Thank you!</p>
</body>
</html>
